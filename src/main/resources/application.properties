# Database Connection (Ensure you are using the new 5433 port if you changed it)
spring.datasource.url=jdbc:postgresql://localhost:5433/ledger_db
spring.datasource.username=ledger_user
spring.datasource.password=ledger_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway temporarily
spring.flyway.enabled=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379